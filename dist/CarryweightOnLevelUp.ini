[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=0

[General]

; Carry weight is a plain formula of your current level:
;     carry weight = fStartingWeight + fPerLevel x (level - 1)
; Change either value and your carry weight is recalculated for your current level at once.

; Carry weight at level 1. Vanilla Skyrim starts at 300.
fStartingWeight=300

; Carry weight added for every level above 1.
fPerLevel=5.0

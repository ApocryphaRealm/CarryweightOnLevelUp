[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=2

[General]

; Carry weight grows with your current level, ON TOP of your race's carry weight and whatever other mods
; add (an Altmer under Imperious keeps its 250):
;     this mod adds  fOffset + fPerLevel x (level - 1)
; Change a value and your carry weight is recalculated for your current level at once. An INI from 1.0.7 or
; older has only fStartingWeight: it is read as an offset of (that - 300).

; Added on top of your race's carry weight at level 1. 0 keeps your race's own value.
fOffset=0.0

; Carry weight added for every level above 1.
fPerLevel=5.0

; 1 = use this mod's own carry weight instead of the race's: your carry weight is set to
;     fStartingWeight + fPerLevel x (level - 1)
; whatever the race and other mods set. 0 (default) = on top of the race, as above. Switching back to 0 gives
; the race's value back exactly - this mod only ever moves its own share.
bUseOwnBaseValues=0

; Carry weight at level 1 while bUseOwnBaseValues=1. Vanilla Skyrim starts at 300.
fStartingWeight=300

; 1 (default) = the starting value above applies (fOffset, or fStartingWeight with bUseOwnBaseValues=1).
; 0 = your starting carry weight stays as your race and other mods set it; only fPerLevel x (level - 1) is added.
bApplyStartingValues=1

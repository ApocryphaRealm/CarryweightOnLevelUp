[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=0

[General]

; Every character level above 1 adds carry weight: 0 = off, 1 = on. Switching it off
; removes the whole bonus cleanly.
bEnabled=1

; Carry weight gained per level. The bonus is always (level - 1) x this value, so it also
; counts levels gained before the mod was installed, and changing the value re-computes
; the whole bonus.
fPerLevel=5.0

; The bonus never exceeds this. 0 = no cap.
fMaxBonus=0
